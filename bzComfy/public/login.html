<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bzComfy — Acceso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0f;
      color: #e2e2e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #18181b;
      border: 1px solid #2a2a30;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }

    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 6px;
      color: #fff;
    }
    .logo span { color: #7c6fff; }

    .subtitle {
      font-size: 13px;
      color: #71717a;
      margin-bottom: 32px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #a1a1aa;
      margin-bottom: 6px;
      letter-spacing: .3px;
    }

    input {
      width: 100%;
      background: #0d0d0f;
      border: 1px solid #2a2a30;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      color: #e2e2e5;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #7c6fff; }

    .btn {
      width: 100%;
      margin-top: 24px;
      padding: 11px;
      background: #7c6fff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .btn:hover   { background: #6a5dea; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .error {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px;
      font-size: 12px;
      color: #f87171;
      display: none;
    }
    .error.show { display: block; }

    .change-notice {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(234,179,8,.1);
      border: 1px solid rgba(234,179,8,.25);
      border-radius: 8px;
      font-size: 12px;
      color: #fbbf24;
      display: none;
    }
    .change-notice.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">bz<span>Comfy</span></div>
    <p class="subtitle">Acceso al panel de generación</p>

    <!-- Login form -->
    <div id="login-form">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" type="text" autocomplete="username" autofocus />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" />
      </div>
      <button class="btn" id="login-btn">Entrar</button>
      <div class="error" id="login-error"></div>
    </div>

    <!-- Change password form (shown after login if mustChangePassword) -->
    <div id="change-form" style="display:none">
      <div class="change-notice show">
        Debes cambiar la contraseña antes de continuar.
      </div>
      <div class="field" style="margin-top:16px">
        <label for="new-password">Nueva contraseña</label>
        <input id="new-password" type="password" autocomplete="new-password" />
      </div>
      <div class="field">
        <label for="confirm-password">Confirmar contraseña</label>
        <input id="confirm-password" type="password" autocomplete="new-password" />
      </div>
      <button class="btn" id="change-btn">Guardar contraseña</button>
      <div class="error" id="change-error"></div>
    </div>
  </div>

  <script>
    const SESSION_KEY = 'bzcomfy_session'
    let sessionToken = null

    function showError(id, msg) {
      const el = document.getElementById(id)
      el.textContent = msg
      el.classList.add('show')
    }
    function hideError(id) {
      document.getElementById(id).classList.remove('show')
    }

    // ── Login ─────────────────────────────────────────────────────────────────
    async function login() {
      hideError('login-error')
      const username = document.getElementById('username').value.trim()
      const password = document.getElementById('password').value
      if (!username || !password) return showError('login-error', 'Rellena usuario y contraseña')

      const btn = document.getElementById('login-btn')
      btn.disabled = true

      try {
        const res  = await fetch('/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password }),
        })
        const data = await res.json()
        if (!res.ok) return showError('login-error', data.error || 'Credenciales incorrectas')

        sessionToken = data.token
        localStorage.setItem(SESSION_KEY, sessionToken)

        if (data.mustChangePassword) {
          // Show change password form
          document.getElementById('login-form').style.display = 'none'
          document.getElementById('change-form').style.display = 'block'
          document.getElementById('new-password').focus()
        } else {
          window.location.href = '/'
        }
      } catch (e) {
        showError('login-error', 'Error de conexión')
      } finally {
        btn.disabled = false
      }
    }

    // ── Change password ───────────────────────────────────────────────────────
    async function changePassword() {
      hideError('change-error')
      const np = document.getElementById('new-password').value
      const cp = document.getElementById('confirm-password').value
      if (!np)       return showError('change-error', 'Escribe la nueva contraseña')
      if (np !== cp) return showError('change-error', 'Las contraseñas no coinciden')
      if (np.length < 6) return showError('change-error', 'Mínimo 6 caracteres')

      const btn = document.getElementById('change-btn')
      btn.disabled = true

      try {
        const res = await fetch('/auth/change-password', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${sessionToken}` },
          body:    JSON.stringify({ password: np }),
        })
        const data = await res.json()
        if (!res.ok) return showError('change-error', data.error || 'Error al cambiar contraseña')
        window.location.href = '/'
      } catch (e) {
        showError('change-error', 'Error de conexión')
      } finally {
        btn.disabled = false
      }
    }

    // ── Events ────────────────────────────────────────────────────────────────
    document.getElementById('login-btn').addEventListener('click', login)
    document.getElementById('change-btn').addEventListener('click', changePassword)

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') login()
    })
    document.getElementById('confirm-password')?.addEventListener('keydown', e => {
      if (e.key === 'Enter') changePassword()
    })

    // If already logged in, go to app
    const existing = localStorage.getItem(SESSION_KEY)
    if (existing) {
      fetch('/auth/me', { headers: { 'Authorization': `Bearer ${existing}` } })
        .then(r => { if (r.ok) window.location.href = '/' })
        .catch(() => {})
    }
  </script>
</body>
</html>
