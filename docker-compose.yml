version: '3.9'

# ─── rpgSpeak — stack completo para Coolify / producción Docker ──────────────
#
# Servicio único:
#   server  — Node.js API + cliente estático (puerto interno 3000)
#
# TTS integrado en el backend Node.js (Microsoft Edge TTS, cloud, sin proceso extra).
# Coolify gestiona el routing HTTPS hacia "server" via Traefik labels.
# ─────────────────────────────────────────────────────────────────────────────

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - rpgspeak-data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_PATH: /app/data/rpgspeak.db
      LOG_LEVEL: info
      CORS_ORIGIN: ${CORS_ORIGIN:-https://drpgspeak.javierbenzo.com}
      MAX_CONTEXT_TOKENS: 8192
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  rpgspeak-data:
