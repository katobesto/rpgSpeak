version: '3.9'

services:
  rpgspeak:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '80:3000'
    volumes:
      - rpgspeak-data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_PATH: /app/data/rpgspeak.db
      LOG_LEVEL: info
      CORS_ORIGIN: '*'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  rpgspeak-data:
